services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recoveryos
      POSTGRES_PASSWORD: recoveryos
      POSTGRES_USER: recoveryos
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveryos -d recoveryos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - recoveryos_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - recoveryos_redis_data:/data

volumes:
  recoveryos_postgres_data:
  recoveryos_redis_data:
